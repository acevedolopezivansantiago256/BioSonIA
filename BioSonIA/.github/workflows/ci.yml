name: CI
on:
  push:
    branches: [main, develop, stage]
  pull_request:
    branches: [develop, stage]

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: cd frontend && npm test --if-present
      - run: cd frontend && npm run build

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: cd backend && npm test --if-present
      - run: cd backend && npm run build

  ai:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r ai/requirements.txt
      - run: python -m pyflakes ai || true # lint placeholder
      - run: echo "AI build placeholder"

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend, ai]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f docker/Dockerfile.frontend -t biosonia/frontend:ci .
          docker build -f docker/Dockerfile.backend -t biosonia/backend:ci .
          docker build -f docker/Dockerfile.ai -t biosonia/ai:ci .
      - name: Push images (opcional)
        run: |
          echo "# docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD"
          echo "# docker push $DOCKER_REGISTRY/frontend:ci"
          echo "# docker push $DOCKER_REGISTRY/backend:ci"
          echo "# docker push $DOCKER_REGISTRY/ai:ci"