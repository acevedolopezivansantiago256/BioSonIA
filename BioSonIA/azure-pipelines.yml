trigger:
  branches:
    include:
      - main
      - develop
      - stage

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Test
  jobs:
  - job: Frontend
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
    - script: npm install
    - script: cd frontend && npm test --if-present && npm run build
  - job: Backend
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
    - script: npm install
    - script: cd backend && npm test --if-present && npm run build
  - job: AI
    steps:
    - script: pip install -r ai/requirements.txt
    - script: echo "AI build placeholder"

- stage: BuildDocker
  dependsOn: Test
  jobs:
  - job: BuildImages
    steps:
    - script: |
        docker build -f docker/Dockerfile.frontend -t biosonia/frontend:ci .
        docker build -f docker/Dockerfile.backend -t biosonia/backend:ci .
        docker build -f docker/Dockerfile.ai -t biosonia/ai:ci .
        echo "# docker login && docker push ..."