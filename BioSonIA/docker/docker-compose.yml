version: "3.9"
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: biosonia
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
    environment:
      PORT: 5001
    ports:
      - "5001:5001"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/biosonia
      JWT_SECRET: ${JWT_SECRET}
      AI_SERVICE_URL: http://ai:5001
      PORT: 5000
    depends_on:
      - db
      - ai
    ports:
      - "5000:5000"
    volumes:
      - ../backend/uploads:/app/uploads

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:5000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data:
