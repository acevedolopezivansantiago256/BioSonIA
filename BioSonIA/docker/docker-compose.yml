version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: biosonia
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
    environment:
      PORT: 5001
    ports:
      - "5001:5001"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/biosonia
      JWT_SECRET: ${JWT_SECRET}
      AI_SERVICE_URL: http://ai:5001
      PORT: 5000
    depends_on:
      - db
      - ai
    ports:
      - "5000:5000"
    volumes:
      - ../backend/uploads:/app/uploads

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:5000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data: